services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ctrm
      POSTGRES_PASSWORD: ctrm
      POSTGRES_DB: ctrm
    ports: ["5432:5432"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro   # runs 01..04 in order on first start
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
